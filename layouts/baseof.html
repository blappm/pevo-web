<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
    {{- with .Description }}
    <meta name="description" content="{{ . }}">
    {{- end }}
    <link href="{{ "css/bootstrap.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/bootstrap-icons.min.css" | relURL }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body class="bg-black text-white">

    {{ partial "navbar.html" . }}

    {{ block "main" . }}{{ end }}

    {{ partial "footer.html" . }}

    <script src="{{ "js/bootstrap.bundle.min.js" | relURL }}"></script>
</body>
</html>
