<!-- Minimalist-Navbar -->
<nav class="navbar navbar-dark bg-black border-bottom border-dark py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold text-white fs-4" href="{{ "/" | relURL }}">
            <span class="text-warning me-2">⚡</span> {{ site.Params.brand }} <span class="fw-light text-muted ms-1 fs-5">{{ site.Params.brandSuffix }}</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            {{- range site.Menus.main }}
            <a href="{{ .URL | relURL }}" class="text-muted text-decoration-none d-none d-sm-inline small">{{ .Name }}</a>
            {{- end }}
            <a href="{{ site.Params.githubURL }}" target="_blank" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                <i class="bi bi-github me-1"></i> GitHub
            </a>
        </div>
    </div>
</nav>
