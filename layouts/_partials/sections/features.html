<!-- Flache Feature-Cards -->
<section id="features" class="py-5 bg-black border-top border-dark">
    <div class="container py-4">
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {{- range .Params.cards }}
            <div class="col">
                <div class="card h-100 bg-dark-subtle border-secondary-subtle rounded-4 p-3 bg-opacity-10">
                    <div class="card-body">
                        <div class="text-warning fs-3 mb-2"><i class="bi bi-{{ .icon }}"></i></div>
                        <h5 class="card-title text-white fw-bold">{{ $.RenderString .title }}</h5>
                        <p class="card-text text-muted small">{{ $.RenderString .text }}</p>
                    </div>
                </div>
            </div>
            {{- end }}
        </div>
    </div>
</section>
