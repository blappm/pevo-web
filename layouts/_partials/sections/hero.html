<!-- Hero Area mit Dashboard-Text & Bild -->
<header class="py-5 bg-black">
    <div class="container py-5">
        <div class="row align-items-center g-5">
            <div class="col-lg-6 text-center text-lg-start">
                <span class="badge bg-dark border border-secondary text-success rounded-pill mb-3 px-3 py-2 fw-semibold font-monospace">{{ .Params.badge }}</span>
                <h1 class="display-5 fw-bold tracking-tight text-white mb-3">{{ .RenderString .Title }}<br><span class="text-warning">{{ .RenderString .Params.title_highlight }}</span></h1>
                <p class="fs-6 text-muted mb-4">{{ .RenderString (strings.TrimSpace .RawContent) }}</p>
                <div class="d-flex justify-content-center justify-content-lg-start gap-3">
                    <a href="{{ .Params.button.url }}" class="btn btn-warning text-black fw-bold px-4 py-2 rounded-pill shadow-sm">{{ .Params.button.text }}</a>
                    <a href="{{ site.Params.sponsorURL }}" class="btn btn-dark border-secondary text-white px-4 py-2 rounded-pill"><i class="bi bi-heart-fill text-danger me-1"></i> Sponsor</a>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="row align-items-center g-4">
                    <div class="col-10 mx-auto">
                        <img src="{{ .Params.image | relURL }}" alt="{{ .Params.image_alt }}" class="img-fluid rounded-4 border border-secondary-subtle shadow transform-hover">
                    </div>
                    <div class="col-12 px-4">
                        <span class="text-success font-monospace small d-block mb-1">{{ .Params.image_eyebrow }}</span>
                        <h4 class="fw-bold text-white mb-2">{{ .RenderString .Params.image_title }}</h4>
                        <p class="text-muted small mb-0">{{ .RenderString .Params.image_text }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
