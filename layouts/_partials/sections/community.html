<!-- Community -->
<section class="py-5 bg-black border-top border-dark text-center">
    <div class="container py-4">
        <h2 class="fw-bold text-white mb-2">{{ .RenderString .Title }}</h2>
        <p class="text-muted small mb-4" style="max-width: 500px; margin: 0 auto;">
            {{ .RenderString (strings.TrimSpace .RawContent) }}
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ .Params.button.url }}" target="_blank" class="btn btn-dark border-secondary px-4 py-2 rounded-pill text-xs">
                <i class="bi bi-{{ .Params.button.icon }} me-2"></i> {{ .Params.button.text }}
            </a>
        </div>
    </div>
</section>
