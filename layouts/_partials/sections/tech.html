<!-- Tech Stack & ZEV -->
<section id="tech" class="py-5 bg-black border-top border-dark">
    <div class="container py-4">
        <div class="row g-4 text-center max-w-2xl mx-auto mb-4">
            <div class="col-12">
                <span class="text-info font-monospace small d-block mb-1">{{ .Params.eyebrow }}</span>
                <h3 class="fw-bold text-white mb-3">{{ .RenderString .Title }}</h3>
                <p class="text-muted small mx-auto mb-4" style="max-width: 650px;">{{ .RenderString (strings.TrimSpace .RawContent) }}</p>
            </div>
        </div>
        <div class="row text-start g-4">
            {{- range .Params.boxes }}
            <div class="col-md-6">
                <div class="p-4 bg-dark-subtle border border-secondary-subtle rounded-4 h-100">
                    <h6 class="text-white fw-bold"><i class="bi bi-{{ .icon }} text-success me-2"></i>{{ $.RenderString .title }}</h6>
                    <p class="text-muted text-xs mb-0">{{ $.RenderString .text }}</p>
                </div>
            </div>
            {{- end }}
        </div>
    </div>
</section>
