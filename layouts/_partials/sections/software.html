<!-- Regelwerk-Logik -->
<section id="software" class="py-5 bg-black border-top border-dark">
    <div class="container py-4">
        <div class="row align-items-center g-5">
            <div class="col-md-6">
                <span class="text-warning font-monospace small d-block mb-2">{{ .Params.eyebrow }}</span>
                <h3 class="fw-bold text-white mb-3">{{ .RenderString .Title }}</h3>
                <p class="text-muted small">{{ .RenderString (strings.TrimSpace .RawContent) }}</p>
                {{- with .Params.code_html }}
                <div class="p-3 bg-dark-subtle border border-secondary-subtle rounded-3 font-monospace text-xs text-muted mb-3">
                    {{ . | safeHTML }}
                </div>
                {{- end }}
                <p class="text-muted small">{{ .RenderString .Params.note }}</p>
            </div>
            <div class="col-md-6 text-center">
                <img src="{{ .Params.image | relURL }}" alt="{{ .Params.image_alt }}" class="img-fluid rounded-4 border border-secondary-subtle shadow">
            </div>
        </div>
    </div>
</section>
